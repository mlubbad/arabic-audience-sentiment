name: Credential-free checks
on:
  push:
    branches: [main]
  pull_request:
    # A draft runs nothing: the checks run once it is marked ready, and again
    # on main after the merge. The repository has been public since 2026-10-10
    # (hosted minutes are free); the rule stays for the queue and the noise.
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `npm run check` stays the one local command. CI runs the same steps split
# across parallel jobs, because one serial job took ~11 minutes (2026-10-06:
# `npm run check` 6m07s, then `npm run test:e2e` 3m50s). The jobs together run
# exactly the steps of `npm run check`, plus the snapshot check and the browser
# suite; scripts/ci-workflow.test.ts fails if a step of `check` is dropped.
#
# `verify` is kept as the single gate: the deploy gate (deploy.yml
# `require_workflow_jobs ci.yml verify`), the playbook and branch protection
# all name it. It succeeds only when every job it needs succeeded.
jobs:
  static:
    name: Static checks and build
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.11
          python-version: 3.12.10
      - run: npm ci
      - run: uv --directory workers/python sync --frozen
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:functions
      - run: npm run build
      # Scans the source and the built assets, so it runs after the build.
      - run: npm run check:secrets
      # Fails if a migration changed the schema without regenerating the
      # checked-in snapshot (supabase/schema/current.sql). Regenerate with
      # `npm run db:snapshot`.
      - run: npm run db:snapshot:check
      # A migration's version is its identity in production: a reused one is
      # skipped there silently, and a merged one is already applied. See
      # scripts/check-migrations.mjs.
      - run: npm run check:migrations
      - name: Merged migrations are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          node scripts/check-migrations.mjs --base "origin/$BASE_REF"

  unit:
    name: Unit and worker tests
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.11
          python-version: 3.12.10
      - run: npm ci
      - run: uv --directory workers/python sync --frozen
      # Includes the dependency-free ownership guard regression tests.
      - run: npm test
      - run: npm run worker:test

  db:
    name: Database tests
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db

  e2e:
    name: Browser tests
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runner image ships Google Chrome with its system libraries;
      # downloading Chromium and its apt dependencies took ~3.5 of the job's
      # 7 minutes (2026-10-10). Without Chrome on the image, install as before.
      - name: Use the runner's Chrome, or install Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 3

  verify:
    needs: [static, unit, db, e2e]
    # `!cancelled()`, not `always()`: the gate still runs when a job fails, so
    # it can fail, but not when the run is cancelled. With `always()` a
    # cancelled run re-queued this job, and a job queued for a runner label no
    # runner carries can never be cancelled (GitHub delivers a cancellation
    # only to a runner), so the run never ended and, through `concurrency`
    # above, every later run on the ref waited behind it (2026-10-10/11).
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every check job to succeed
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          DB: ${{ needs.db.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          failed=0
          for pair in "static=$STATIC" "unit=$UNIT" "db=$DB" "e2e=$E2E"; do
            echo "$pair"
            [ "${pair#*=}" = success ] || failed=1
          done
          exit "$failed"
