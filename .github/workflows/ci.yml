name: Credential-free checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.11.11
          python-version: 3.12.10
      - run: npm ci
      - run: uv --directory workers/python sync --frozen
      - run: npx playwright install --with-deps chromium
      # Includes the dependency-free ownership guard regression tests.
      - run: npm run check
      # Fails if a migration changed the schema without regenerating the
      # checked-in snapshot (supabase/schema/current.sql). Regenerate with
      # `npm run db:snapshot`.
      - run: npm run db:snapshot:check
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 3
