# Cross-file (interprocedural) taint analysis via the official CodeQL engine.
#
# Licensing note: code scanning upload requires GitHub Code Security on private
# repos, so the analysis runs with `upload: never` — the same official engine
# and security-extended queries, with results reported as PR annotations,
# check-run output, and a downloadable SARIF artifact instead of the Security tab.
# The repository has been public since 2026-10-10, so the upload is free now;
# turning it on (remove `upload: never`) is a separate, owner-approved change,
# because the Security tab then becomes the record and this comment goes.
name: CodeQL

on:
  pull_request:
    # A draft runs nothing: the checks run once it is marked ready, and again
    # on main after the merge. The repository has been public since 2026-10-10
    # (hosted minutes are free); the rule stays for the queue and the noise.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          upload: never
          output: sarif-results
          category: "/language:${{ matrix.language }}"
      - name: Save SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results/*.sarif
          retention-days: 30
