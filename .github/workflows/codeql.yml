# Cross-file (interprocedural) taint analysis via the official CodeQL engine.
#
# Licensing note: code scanning upload requires GitHub Code Security on private
# repos, so the analysis runs with `upload: never` — the same official engine
# and security-extended queries, with results reported as PR annotations,
# check-run output, and a downloadable SARIF artifact instead of the Security tab.
# To get the hosted Security tab later: enable GitHub Code Security (or make the
# repo public) and change `upload: never` back to the default.
name: CodeQL

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504 # v3
        with:
          upload: never
          output: sarif-results
          category: "/language:${{ matrix.language }}"
      - name: Save SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results/*.sarif
          retention-days: 30
