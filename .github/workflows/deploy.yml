# Deploy only an exact main commit whose credential-free and security workflows passed.
# Every third-party action is pinned to a full commit SHA with the version in a comment.
name: Deploy Preview

on:
  workflow_run:
    workflows: ["Credential-free checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-preview-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  required-checks:
    name: Require verified main commit
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require successful CI and Security jobs for this commit
        shell: bash
        run: |
          set -euo pipefail

          require_workflow_jobs() {
            local workflow_file=$1
            shift
            local response run_id status conclusion jobs job job_conclusion

            for attempt in {1..90}; do
              response=$(gh api -X GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs" \
                -f head_sha="$TARGET_SHA" -f event=push -f branch=main -f per_page=10)
              run_id=$(jq -r --arg sha "$TARGET_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | sort_by(.run_number) | last | .id // empty' \
                <<<"$response")

              if [ -z "$run_id" ]; then
                sleep 10
                continue
              fi

              status=$(jq -r --arg sha "$TARGET_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | sort_by(.run_number) | last | .status' \
                <<<"$response")
              conclusion=$(jq -r --arg sha "$TARGET_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | sort_by(.run_number) | last | .conclusion' \
                <<<"$response")

              if [ "$status" != completed ]; then
                sleep 10
                continue
              fi
              if [ "$conclusion" != success ]; then
                echo "$workflow_file did not succeed for $TARGET_SHA: $conclusion" >&2
                return 1
              fi

              jobs=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
              for job in "$@"; do
                job_conclusion=$(jq -r --arg name "$job" \
                  '[.jobs[] | select(.name == $name)] | if length == 1 then .[0].conclusion else "missing" end' \
                  <<<"$jobs")
                if [ "$job_conclusion" != success ]; then
                  echo "$workflow_file job '$job' is not successful for $TARGET_SHA: $job_conclusion" >&2
                  return 1
                fi
              done
              return 0
            done

            echo "Timed out waiting for $workflow_file on $TARGET_SHA" >&2
            return 1
          }

          require_workflow_jobs ci.yml verify
          require_workflow_jobs security.yml \
            "Secret scan" "Semgrep SAST" "Dependency audit"

  deploy:
    name: Deploy preview & migrations
    needs: required-checks
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: production
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require deployment credentials
        shell: bash
        env:
          PREVIEW_FTP_HOST: ${{ secrets.PREVIEW_FTP_HOST }}
          PREVIEW_FTP_USER: ${{ secrets.PREVIEW_FTP_USER }}
          PREVIEW_FTP_PASSWORD: ${{ secrets.PREVIEW_FTP_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          missing=()
          for name in PREVIEW_FTP_HOST PREVIEW_FTP_USER PREVIEW_FTP_PASSWORD \
            SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required deployment secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Verify build safety and types
        run: npm run check:secrets && npm run typecheck

      # The VITE_* values ship inside the bundle, so they are public by design
      # and live in repository variables rather than tracked files. Without the
      # Supabase pair the build quietly becomes the fixture-only preview with
      # sign-in off, which is what every CI build was until 2026-10-03.
      - name: Build frontend distribution
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SITE_PUBLIC: ${{ vars.VITE_SITE_PUBLIC }}
          VITE_AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_PADDLE_CLIENT_TOKEN: ${{ vars.VITE_PADDLE_CLIENT_TOKEN }}
          VITE_PADDLE_ENV: ${{ vars.VITE_PADDLE_ENV }}
          VITE_DASHBOARD_SOURCE: ${{ vars.VITE_DASHBOARD_SOURCE }}
        run: |
          set -euo pipefail
          missing=()
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required repository variable: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          npm run build

      - name: Apply remote database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run db:migrate:remote

      - name: Deploy frontend to preview host via FTPS
        env:
          PREVIEW_FTP_HOST: ${{ secrets.PREVIEW_FTP_HOST }}
          PREVIEW_FTP_USER: ${{ secrets.PREVIEW_FTP_USER }}
          PREVIEW_FTP_PASSWORD: ${{ secrets.PREVIEW_FTP_PASSWORD }}
        run: sh scripts/deploy-preview.sh

      # An upload proves the bytes reached the FTP account, not that the site
      # serves them (2026-10-02: four "successful" deploys never went live).
      - name: Verify the live site serves this build
        env:
          DEPLOY_VERIFY_URL: https://app.sky-develop.net
        run: node scripts/verify-deploy.mjs
