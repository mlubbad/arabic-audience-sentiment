# Probes the live platform from outside every 30 minutes (scripts/monitor.sh)
# and keeps one open issue per failing check (scripts/monitor-alerts.mjs).
#
# Why here: the monitor was a crontab entry on the owner's Mac, and macOS
# privacy protection refused it on every run from 2026-09-19 (1,930 logged
# refusals, then not even the log), so for four weeks there was no external
# alarm while the docs said there was. A monitor on the machine that runs the
# worker would also sleep and die with it. So it runs on the hosted runner by
# name: never on CI_RUNNER or DEPLOY_RUNNER, which may be that machine.
#
# Its secrets live in the `monitor` environment, which should allow `main`
# only. Missing ones are not skipped: the run reports `monitor` failing and
# opens an issue saying which names are missing.
#
# The run's exit code is recorded, not raised: a failing check is reported
# by its issue, once, rather than by a failed run every 30 minutes. A run
# whose alerting step fails does fail, so a broken alarm is loud too.
name: Platform monitor
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: platform-monitor
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TEMPORARY (branch verification, reverted before review): no environment, so no secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe the platform from outside
        id: probe
        shell: bash
        timeout-minutes: 5
        env:
          MONITOR_ENV_FILE: ""
          MONITOR_STATE_DIR: ${{ runner.temp }}/monitor-state
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKER_API_BASE_URL: ${{ secrets.WORKER_API_BASE_URL }}
          WORKER_CREDENTIAL: ${{ secrets.WORKER_CREDENTIAL }}
          PREVIEW_URL: https://app.sky-develop.net/
        # GitHub runs `shell: bash` as `bash -eo pipefail`, so a bare failing
        # command ends the step on the spot. Both first runs (2026-10-17) died
        # that way on monitor.sh's exit 2: no output in the log and no issue.
        # The `||` keeps -e from firing; the code is recorded, not raised.
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/monitor-output.txt"
          code=0
          sh scripts/monitor.sh > "$output" 2>&1 || code=$?
          cat "$output"
          echo "monitor.sh exited $code (0 healthy, 1 warning, 2 failure)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # Runs after a probe that failed or timed out too: a probe that left no
      # result is the `monitor` check failing, and that needs its issue most.
      - name: Open or close one issue per failing check
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MONITOR_EXIT_CODE: ${{ steps.probe.outputs.code }}
        run: node scripts/monitor-alerts.mjs "$RUNNER_TEMP/monitor-output.txt"
