# Security checks — supply chain, secrets, and static analysis.
# Every third-party action is pinned to a full commit SHA so a repointed tag
# cannot inject code into CI (mutable-tag supply-chain attack).
#
# Licensing note: dependency-review-action and gitleaks-action wrappers require
# GitHub Advanced Security or a commercial license on private repositories.
# This workflow uses the free equivalents instead: npm/pip-audit for dependency
# review and the gitleaks CLI directly for secret scanning. The repository has
# been public since 2026-10-10, which would allow the wrappers; the equivalents
# stay because they are pinned, tested and independent of the visibility.
name: Security

on:
  pull_request:
    # A draft runs nothing: the checks run once it is marked ready, and again
    # on main after the merge. The repository has been public since 2026-10-10
    # (hosted minutes are free); the rule stays for the queue and the noise.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    # Fails when production dependencies carry known HIGH+ CVEs.
    # npm: production deps only (dev deps are audited by dependabot weekly).
    # pip: the Python worker's locked runtime via pip-audit.
    name: Dependency audit
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.11.11
      # RUNNER_TEMP, not /tmp: a self-hosted machine with two runners shares
      # /tmp between unrelated jobs.
      - name: Export locked Python requirements
        run: uv export --directory workers/python --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit (locked runtime)
        run: uv run --no-project --with pip-audit pip-audit -r "$RUNNER_TEMP/requirements.txt" --strict

  secrets:
    # Scans the full history for committed credentials via the gitleaks CLI
    # (pinned binary, no wrapper action needed).
    name: Secret scan
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The archive for the runner's CPU (a self-hosted runner on an Apple
      # Silicon Mac is linux/arm64), checksum-verified, unpacked into the
      # job's own temp directory: a self-hosted runner's user cannot write
      # /usr/local/bin, and the runner empties RUNNER_TEMP after each job.
      - name: Install gitleaks
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "No gitleaks build for runner arch $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          ARCHIVE="gitleaks_8.30.1_linux_${arch}.tar.gz"
          DIR="$RUNNER_TEMP/gitleaks"
          mkdir -p "$DIR"
          curl -sSL --fail -o "$DIR/$ARCHIVE" "$BASE/$ARCHIVE"
          curl -sSL --fail -o "$DIR/checksums.txt" "$BASE/gitleaks_8.30.1_checksums.txt"
          EXPECTED=$(grep " $ARCHIVE\$" "$DIR/checksums.txt" | awk '{print $1}')
          [ -n "$EXPECTED" ] || { echo "No checksum listed for $ARCHIVE" >&2; exit 1; }
          echo "$EXPECTED  $DIR/$ARCHIVE" | sha256sum -c -
          tar -xzf "$DIR/$ARCHIVE" -C "$DIR" gitleaks
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/gitleaks" version
      - name: Scan full history
        run: gitleaks detect --source . --redact --exit-code 1 --no-banner

  semgrep:
    # Same high-confidence security ruleset run locally; blocks on ERROR severity.
    name: Semgrep SAST
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    container:
      # Digest-pinned: a repointed Docker tag is the same supply-chain risk as
      # a repointed action tag. sha256:acaac22f… = semgrep/semgrep:1.177.0
      image: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        run: >-
          semgrep scan --metrics=off --severity ERROR
          --config p/typescript --config p/react --config p/nodejs
          --config p/python --config p/security-audit --config p/secrets
          --config p/owasp-top-ten
