# Security checks — supply chain, secrets, and static analysis.
# Every third-party action is pinned to a full commit SHA so a repointed tag
# cannot inject code into CI (mutable-tag supply-chain attack).
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Fails the PR when new dependencies carry known CVEs or prohibited licenses.
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, AGPL-3.0-or-later

  secrets:
    # Scans the full history for committed credentials, not just the diff.
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    # Same high-confidence security ruleset run locally; blocks on ERROR severity.
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.177.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan
        run: >-
          semgrep scan --metrics=off --severity ERROR
          --config p/typescript --config p/react --config p/nodejs
          --config p/python --config p/security-audit --config p/secrets
          --config p/owasp-top-ten
