services:
  sentiment-worker:
    build:
      context: ./workers/python
      dockerfile: Dockerfile
    image: sentiment-worker:latest
    container_name: sentiment-worker
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    # Credentials come from the env files above, and only from there. They used
    # to be repeated here as `KEY=${KEY}`, but Compose fills `${KEY}` from the
    # shell or a file named `.env` only: with just `.env.local` on a server,
    # each became an empty string that overrode the real value, and the worker
    # stopped at "need WORKER_API_BASE_URL and WORKER_CREDENTIAL".
    environment:
      - SENTIMENT_MODEL=${SENTIMENT_MODEL:-camelbert-da}
      - TOPIC_MODEL=${TOPIC_MODEL:-gemini}
      - WORKER_IDLE_SECONDS=${WORKER_IDLE_SECONDS:-30}
      - WORKER_MAX_IDLE=${WORKER_MAX_IDLE:-30}
      # torch threads for inference: one per core. The Oracle VM is 1 OCPU /
      # 6 GB (owner's choice, 2026-10-13: at ~2 GB resident the memory stays
      # above the idle-reclamation threshold); raise this with the shape.
      - SENTIMENT_TORCH_THREADS=${SENTIMENT_TORCH_THREADS:-1}
    # The Hugging Face cache (HF_HOME in the image): the pinned checkpoint is
    # downloaded once and survives restarts and image rebuilds.
    volumes:
      - hf-cache:/app/.cache/huggingface
    # torch plus the CAMeLBERT checkpoint need about 1.5 GB resident; the old
    # 1536M limit was set for a worker that loaded no model.
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

volumes:
  hf-cache:
