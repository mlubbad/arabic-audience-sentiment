<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:transparent}
  .canvas{width:512px;height:512px;display:flex;align-items:center;justify-content:center}
  .mark{display:inline-flex;align-items:center;justify-content:center;gap:33px;
        transform:rotate(-10deg)}
  .mark i{background:#3b27ba;width:55px;border-radius:9999px;display:block}
  .mark i:nth-child(1){height:154px}
  .mark i:nth-child(2){height:275px}
  .mark i:nth-child(3){height:209px}
  .mark i:nth-child(4){height:110px;background:#ff5c67}
</style></head>
<body>
  <div class="canvas">
    <span class="mark"><i></i><i></i><i></i><i></i></span>
  </div>
</body></html>
